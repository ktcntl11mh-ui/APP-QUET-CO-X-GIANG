<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTL - Quét OCR Trực Tiếp</title>
    <!-- Thư viện OCR Tesseract.js chạy trực tiếp trên trình duyệt - Miễn phí 100% -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: #f2f4f8;
            font-size: 18px;
        }
        .card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #222; font-size: 18px; }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #007bff;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
        }
        .season-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-season {
            flex: 1 1 calc(50% - 8px);
            padding: 12px;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-season.active { background: #007bff; color: white; }
        
        /* KHUNG CAMERA LIVE STREAM */
        #camera-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-guide {
            position: absolute;
            top: 25%;
            left: 10%;
            width: 80%;
            height: 50%;
            border: 3px dashed #00ff00;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }
        .btn-scan { background: #17a2b8; margin-bottom: 10px; }
        .btn-save { background: #28a745; }
        #resultBox {
            width: 100%;
            height: 60px;
            padding: 10px;
            border: 2px solid #007bff;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #d9534f;
        }
        #status { margin-top: 10px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <!-- Mùa SX -->
    <div class="form-group">
        <label>Mùa SX</label>
        <div id="seasonButtons" class="season-container">
            <span style="color:#777;">⏳ Đang tải Mùa SX...</span>
        </div>
    </div>

    <!-- Đơn hàng -->
    <div class="form-group">
        <label>Đơn hàng *</label>
        <select id="donHangSelect">
            <option value="">-- Chọn Mùa SX trước --</option>
        </select>
    </div>

    <!-- KHUNG CAMERA DÒ VĂN BẢN TRỰC TIẾP -->
    <label>Giơ camera vào chữ trong khung xanh:</label>
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-guide"></div>
    </div>

    <button class="btn-action btn-scan" id="scanBtn" onclick="toggleAutoScan()">▶ BẮT ĐẦU QUÉT TỰ ĐỘNG</button>

    <!-- Cỡ x giàng quét được -->
    <div class="form-group">
        <label>Dòng đầu tiên nhận diện được:</label>
        <textarea id="resultBox" placeholder="Chữ quét tự động sẽ hiện ở đây..."></textarea>
    </div>

    <!-- Nút Save -->
    <button class="btn-action btn-save" onclick="saveToGoogleSheets()">💾 SAVE CSDL</button>

    <div id="status"></div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjJiOWEtk_1cFeDqJnlXpzW0Fud7JH8wfdy7bFnEXUJzmrw6ymzdXt51sDqPF2bHXS/exec';

let rawStyleData = [];
let selectedSeason = localStorage.getItem('saved_season') || '';
let savedDonHang = localStorage.getItem('saved_donhang') || '';
let isScanning = false;
let videoStream = null;
let scanInterval = null;

window.onload = async function() {
    initCamera();
    
    const status = document.getElementById('status');
    status.innerText = "⏳ Đang nạp dữ liệu Mùa SX & Đơn hàng...";
    status.style.color = "blue";

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const json = await res.json();
        rawStyleData = json.data || [];
        renderSeasons();
        status.innerText = "";
    } catch (e) {
        status.innerText = "❌ Lỗi tải CSDL!";
        status.style.color = "red";
    }
};

// BẬT CAMERA WEBRTC TRÊN WEB
async function initCamera() {
    const video = document.getElementById('webcam');
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        });
        video.srcObject = videoStream;
    } catch (err) {
        // Nếu không lấy được camera sau, fallback về camera mặc định
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = videoStream;
        } catch (e) {
            alert("Vui lòng cấp quyền truy cập Camera cho trang web!");
        }
    }
}

// BẬT / TẮT QUÉT DÒ VĂN BẢN TỰ ĐỘNG
function toggleAutoScan() {
    const btn = document.getElementById('scanBtn');
    const status = document.getElementById('status');

    if (!isScanning) {
        isScanning = true;
        btn.innerText = "⏹ DỪNG QUÉT";
        btn.style.background = "#dc3545";
        status.innerText = "👀 Đang dò chữ tự động...";
        status.style.color = "green";
        
        // Quét tự động mỗi 1.5 giây
        scanInterval = setInterval(captureAndAnalyze, 1500);
    } else {
        stopAutoScan();
    }
}

function stopAutoScan() {
    isScanning = false;
    clearInterval(scanInterval);
    const btn = document.getElementById('scanBtn');
    btn.innerText = "▶ BẮT ĐẦU QUÉT TỰ ĐỘNG";
    btn.style.background = "#17a2b8";
}

// CHỤP FRAME VIDEO VÀ PHÂN TÍCH CHỮ DÒNG ĐẦU TIÊN
async function captureAndAnalyze() {
    if (!isScanning) return;

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const context = canvas.getContext('2d');

    if (video.videoWidth === 0) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    try {
        const result = await Tesseract.recognize(canvas, 'eng+vie', {
            logger: m => {}
        });

        const rawText = result.data.text.trim();
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

        if (lines.length > 0 && isScanning) {
            document.getElementById('resultBox').value = lines[0]; // Lấy đúng 1 dòng đầu tiên
            document.getElementById('status').innerText = "✅ Đã tìm thấy cỡ x giàng!";
            document.getElementById('status').style.color = "green";
            stopAutoScan(); // Tìm thấy chữ thì dừng quét tự động
        }
    } catch (e) {
        console.log("Đang dò chữ...");
    }
}

function renderSeasons() {
    const seasons = [...new Set(rawStyleData.map(item => item.muaSX))];
    const container = document.getElementById('seasonButtons');
    container.innerHTML = '';

    if (seasons.length === 0) return;

    if (!selectedSeason || !seasons.includes(selectedSeason)) {
        selectedSeason = seasons[0];
    }

    seasons.forEach(season => {
        const btn = document.createElement('button');
        btn.className = 'btn-season' + (season === selectedSeason ? ' active' : '');
        btn.innerText = season;
        btn.onclick = () => selectSeason(season);
        container.appendChild(btn);
    });

    updateDonHangDropdown();
}

function selectSeason(season) {
    selectedSeason = season;
    localStorage.setItem('saved_season', season);
    document.querySelectorAll('.btn-season').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === season);
    });
    updateDonHangDropdown();
}

function updateDonHangDropdown() {
    const select = document.getElementById('donHangSelect');
    select.innerHTML = '';

    const filtered = rawStyleData.filter(item => item.muaSX === selectedSeason);
    const uniqueDonHang = [...new Set(filtered.map(item => item.donHang))];

    uniqueDonHang.forEach(dh => {
        const opt = document.createElement('option');
        opt.value = dh;
        opt.innerText = dh;
        select.appendChild(opt);
    });

    if (savedDonHang && uniqueDonHang.includes(savedDonHang)) {
        select.value = savedDonHang;
    } else if (uniqueDonHang.length > 0) {
        select.value = uniqueDonHang[0];
        localStorage.setItem('saved_donhang', uniqueDonHang[0]);
    }

    select.onchange = function() {
        localStorage.setItem('saved_donhang', this.value);
    };
}

async function saveToGoogleSheets() {
    const donHang = document.getElementById('donHangSelect').value;
    const vanBan = document.getElementById('resultBox').value;
    const status = document.getElementById('status');

    if (!donHang) { alert("Vui lòng chọn Đơn hàng!"); return; }
    if (!vanBan) { alert("Chưa có nội dung cỡ x giàng!"); return; }

    status.innerText = "⏳ Đang lưu...";
    status.style.color = "blue";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ muaSX: selectedSeason, donHang: donHang, vanBan: vanBan })
        });

        status.innerText = "🎉 ĐÃ LƯU THÀNH CÔNG!";
        status.style.color = "green";
        document.getElementById('resultBox').value = "";
    } catch (e) {
        status.innerText = "❌ Lỗi khi lưu dữ liệu!";
        status.style.color = "red";
    }
}
</script>

</body>
</html>
